# .github/workflows/ci.yml
name: CI & Quality Gates

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade Pip & Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rich python-pptx pytest

    - name: Run Syntax and Compile Check
      run: |
        python -m py_compile swarm.py utils.py agents.py

    - name: Run Test Suite (if present)
      run: |
        if [ -d "tests" ]; then
          pytest tests/ -v
        else
          echo "No standalone tests/ directory yet; verified core syntax successfully."
        fi
